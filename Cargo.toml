[package]
name = "cacher"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "High-performance concurrent caching engine for statistical arbitrage"
license = "MIT OR Apache-2.0"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "tracing"] }

# Concurrent data structures
dashmap = "5.5"
parking_lot = "0.12"
crossbeam = "0.8"

# Serialization (zero-copy)
rkyv = { version = "0.7", features = ["validation"] }

# gRPC
tonic = "0.11"
prost = "0.12"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async trait support
async-trait = "0.1"

# Random sampling for eviction
rand = "0.8"

# Time utilities
chrono = "0.4"

[build-dependencies]
tonic-build = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"

[[bin]]
name = "cacher"
path = "src/main.rs"

[lib]
name = "cacher"
path = "src/lib.rs"
